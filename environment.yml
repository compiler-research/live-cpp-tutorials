name: livecpp-ci
channels:
  - conda-forge
  - nvidia
dependencies:
  - python=3.12.*         # the cppjit wheel of the release is built for 3.12
  - xeus-cpp
  - jupyter
  - nbconvert
  - llvm-openmp
  - cuda-toolkit=12
  - clangdev=21
  - cuda-cudart-dev
  - papermill
  - pytest
  # cppjit series: the Python kernel compiles C++ through cppjit, installed by the workflow from this repository's
  # release (the wheel carries CppInterOp built with the Clad plugin; the PyPI wheel has no Clad yet)
  - numpy
  - scipy
  - matplotlib-base
  - ipykernel
  - pip
